apiVersion: v1
kind: Service
metadata:
  name: {{ include "developer-content-creator.fullname" . }}-repository-service
  labels:
    app.kubernetes.io/name: repository-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: repository-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
