replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-registry-credentials

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  SPRING_PROFILES_ACTIVE: dev
  SERVER_PORT: "8080"
  DB_URL: ""
  DB_USERNAME: ""
  DB_PASSWORD_SECRET_NAME: repository-service-db
  DB_PASSWORD_SECRET_KEY: DB_PASSWORD

probes:
  readiness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /api/v1/health
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
