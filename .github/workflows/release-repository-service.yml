name: Release - repository-service

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer à valider (ex. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-repository-service-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate repository-service release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ensure release validation runs from main
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::La validation de release doit être lancée depuis la branche main."
            echo "::error::Référence actuelle : ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and tag convention
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version invalide : '$RELEASE_VERSION'. Format attendu : MAJOR.MINOR.PATCH, par exemple 1.0.0."
            exit 1
          fi

          RELEASE_TAG="repository-service-v${RELEASE_VERSION}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Le tag ${RELEASE_TAG} existe déjà."
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Version validée : ${RELEASE_VERSION}"
          echo "Tag prévu : ${RELEASE_TAG}"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build and verify repository-service with dependencies
        run: >
          mvn -B -ntp
          -pl backend/repository-service
          -am clean verify

      - name: Verify JaCoCo reports
        run: ./scripts/verify-jacoco-coverage.sh

      - name: Summarize release validation
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          {
            echo "## Release validation"
            echo
            echo "- Service : \`repository-service\`"
            echo "- Version proposée : \`${RELEASE_VERSION}\`"
            echo "- Tag prévu : \`${RELEASE_TAG}\`"
            echo "- Build Maven : réussi"
            echo
            echo "**Mode validation uniquement : aucun tag ni artefact publié.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-service-release-validation
          path: |
            backend/**/target/site/jacoco/
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14