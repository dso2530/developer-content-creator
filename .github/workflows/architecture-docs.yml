name: Architecture Documentation

on:
  pull_request:
    paths:
      - "architecture/structurizr/**"
      - "docs/architecture/c4/**"
      - "scripts/architecture/**"
      - ".github/workflows/architecture-docs.yml"

  push:
    branches:
      - main
    paths:
      - "architecture/structurizr/**"
      - "docs/architecture/c4/**"
      - "scripts/architecture/**"
      - ".github/workflows/architecture-docs.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate C4 model and diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check architecture files
        run: |
          set -euo pipefail

          test -f architecture/structurizr/workspace.dsl
          test -f scripts/architecture/generate-c4.sh
          test -d docs/architecture/c4/diagrams

      - name: Generate and validate C4 diagrams
        run: |
          set -euo pipefail

          chmod +x scripts/architecture/generate-c4.sh

          scripts/architecture/generate-c4.sh \
            --check \
            "$RUNNER_TEMP/architecture-diagrams"

      - name: Upload generated diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-c4-diagrams
          path: ${{ runner.temp }}/architecture-diagrams/
          if-no-files-found: warn
          retention-days: 7