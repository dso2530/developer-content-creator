name: Publish - repository-service

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer à publier (ex. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-repository-service-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish repository-service release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ensure publication runs from main
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::La publication doit être lancée depuis la branche main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and tag
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version invalide : '$RELEASE_VERSION'. Format attendu : MAJOR.MINOR.PATCH."
            exit 1
          fi

          RELEASE_TAG="repository-service-v${RELEASE_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Le tag ${RELEASE_TAG} existe déjà sur le dépôt distant."
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Java formatting
        run: mvn -B -ntp spotless:check

      - name: Build and verify repository-service
        run: >
          mvn -B -ntp
          -pl backend/repository-service
          -am clean verify

      - name: Verify JaCoCo reports
        run: ./scripts/verify-jacoco-coverage.sh

      - name: Create and push annotated tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::La branche main a changé. Relance la validation avant publication."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Le tag ${RELEASE_TAG} existe déjà."
            exit 1
          fi

          git tag -a "$RELEASE_TAG" -m "Release repository-service ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "repository-service ${RELEASE_VERSION}" \
            --generate-notes

      - name: Summarize publication
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          {
            echo "## Publication réussie"
            echo
            echo "- Service : \`repository-service\`"
            echo "- Version : \`${RELEASE_VERSION}\`"
            echo "- Tag : \`${RELEASE_TAG}\`"
            echo "- Commit : \`$(git rev-parse HEAD)\`"
            echo "- GitHub Release : publiée"
          } >> "$GITHUB_STEP_SUMMARY"
