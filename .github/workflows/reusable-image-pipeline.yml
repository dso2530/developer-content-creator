name: Reusable - Build, scan and publish service image

on:
  workflow_call:
    inputs:
      service_name:
        description: "Nom du microservice et de l'image"
        required: true
        type: string

      module_path:
        description: "Chemin du module Maven"
        required: true
        type: string

      dockerfile_path:
        description: "Chemin du Dockerfile"
        required: true
        type: string

      release_tag_prefix:
        description: "Préfixe du tag Git de release"
        required: true
        type: string

      manual_version:
        description: "Version SemVer déjà validée à publier manuellement"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_version != '' && format('{0}{1}', inputs.release_tag_prefix, inputs.manual_version) || github.ref }}
          fetch-depth: 0

      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch' && inputs.manual_version != ''
        env:
          VERSION: ${{ inputs.manual_version }}
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version invalide : $VERSION"
            exit 1
          fi

          TAG="${RELEASE_TAG_PREFIX}${VERSION}"

          git fetch origin main --tags

          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Le tag $TAG n'existe pas."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Le commit du tag $TAG n'appartient pas à l'historique de main."
            exit 1
          fi

          echo "Tag validé : $TAG"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Check Java formatting
        run: mvn -B -ntp spotless:check

      - name: Build and verify service with dependencies
        env:
          MODULE_PATH: ${{ inputs.module_path }}
        run: |
          set -euo pipefail

          mvn -B -ntp \
            -pl "$MODULE_PATH" \
            -am clean verify

      - name: Verify JaCoCo reports
        run: ./scripts/verify-jacoco-coverage.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name }}-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/**/target/site/jacoco/
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  build-scan-publish:
    name: Build, scan and publish ${{ inputs.service_name }}
    runs-on: [self-hosted, Linux, X64]
    needs: verify
    timeout-minutes: 45

    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        startsWith(github.ref, format('refs/tags/{0}', inputs.release_tag_prefix)))
      ) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.manual_version != '')

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_version != '' && format('{0}{1}', inputs.release_tag_prefix, inputs.manual_version) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate checked-out release commit
        if: github.event_name == 'workflow_dispatch' && inputs.manual_version != ''
        env:
          VERSION: ${{ inputs.manual_version }}
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG_PREFIX}${VERSION}"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"

          if [[ "$CHECKED_OUT_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error::Le commit checkouté ne correspond pas au tag $TAG."
            exit 1
          fi

          echo "Commit de release validé : $CHECKED_OUT_COMMIT"

      - name: Check Podman and Trivy
        shell: bash
        run: |
          set -euo pipefail

          command -v podman
          podman --version
          podman info

          command -v trivy
          trivy --version

      - name: Prepare security reports
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security

      - name: Resolve image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.manual_version }}
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix }}
          SERVICE_NAME: ${{ inputs.service_name }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$HARBOR_REGISTRY" || -z "$HARBOR_PROJECT" ]]; then
            echo "::error::Définis HARBOR_REGISTRY et HARBOR_PROJECT dans les variables GitHub."
            exit 1
          fi

          if [[ ! "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9.-]+:[0-9]+$ ]]; then
            echo "::error::HARBOR_REGISTRY doit être au format host:port."
            exit 1
          fi

          if [[ ! "$HARBOR_PROJECT" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Nom de projet Harbor invalide."
            exit 1
          fi

          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Nom de service invalide."
            exit 1
          fi

          IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${SERVICE_NAME}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          VERSION=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF" == "refs/tags/${RELEASE_TAG_PREFIX}"* ]]; then
            VERSION="${REF#refs/tags/}"
            VERSION="${VERSION#"$RELEASE_TAG_PREFIX"}"
          fi

          if [[ -n "$VERSION" && ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version de release invalide : $VERSION"
            exit 1
          fi

          {
            printf 'image=%s\n' "$IMAGE"
            printf 'sha_tag=%s\n' "$IMAGE:sha-$SHORT_SHA"
            printf 'commit_sha=%s\n' "$COMMIT_SHA"
            printf 'version_tag=%s\n' "${VERSION:+$IMAGE:$VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image with Podman
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        shell: bash
        run: |
          set -euo pipefail

          podman build \
            --pull=always \
            --tag "$SHA_TAG" \
            --file "$DOCKERFILE_PATH" \
            .

      - name: Export image for Trivy
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.service_name }}-image.tar
        shell: bash
        run: |
          set -euo pipefail

          podman save \
            --format docker-archive \
            --output "$IMAGE_ARCHIVE" \
            "$SHA_TAG"

          test -s "$IMAGE_ARCHIVE"

      - name: Generate image SBOM
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.service_name }}-image.tar
          SERVICE_NAME: ${{ inputs.service_name }}
        shell: bash
        run: |
          set -euo pipefail

          trivy image \
            --input "$IMAGE_ARCHIVE" \
            --format cyclonedx \
            --output "reports/security/${SERVICE_NAME}-sbom.cdx.json"

          test -s "reports/security/${SERVICE_NAME}-sbom.cdx.json"

      - name: Scan image vulnerabilities
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.service_name }}-image.tar
          SERVICE_NAME: ${{ inputs.service_name }}
        shell: bash
        run: |
          set -euo pipefail

          trivy image \
            --input "$IMAGE_ARCHIVE" \
            --scanners vuln \
            --format json \
            --output "reports/security/${SERVICE_NAME}-vulnerabilities.json"

          test -s "reports/security/${SERVICE_NAME}-vulnerabilities.json"

      - name: Enforce vulnerability policy
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.service_name }}-image.tar
          SERVICE_NAME: ${{ inputs.service_name }}
        shell: bash
        run: |
          set -euo pipefail

          trivy image \
            --input "$IMAGE_ARCHIVE" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            | tee "reports/security/${SERVICE_NAME}-vulnerabilities.txt"

      - name: Authenticate to Harbor
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          AUTHFILE: ${{ runner.temp }}/harbor-auth-${{ github.run_id }}-${{ github.run_attempt }}.json
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$HARBOR_USERNAME" || -z "$HARBOR_PASSWORD" ]]; then
            echo "::error::Secrets Harbor absents."
            exit 1
          fi

          umask 077

          printf '%s' "$HARBOR_PASSWORD" |
            podman login \
              --authfile "$AUTHFILE" \
              --tls-verify=false \
              --username "$HARBOR_USERNAME" \
              --password-stdin \
              "$HARBOR_REGISTRY"

      - name: Push image to Harbor
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          AUTHFILE: ${{ runner.temp }}/harbor-auth-${{ github.run_id }}-${{ github.run_attempt }}.json
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            podman logout \
              --authfile "$AUTHFILE" \
              "${IMAGE%%/*}" >/dev/null 2>&1 || true
            rm -f "$AUTHFILE"
          }
          trap cleanup EXIT

          podman push \
            --authfile "$AUTHFILE" \
            --tls-verify=false \
            "$SHA_TAG"

          if [[ -n "$VERSION_TAG" ]]; then
            podman tag "$SHA_TAG" "$VERSION_TAG"

            podman push \
              --authfile "$AUTHFILE" \
              --tls-verify=false \
              "$VERSION_TAG"
          fi

      - name: Clean up Harbor credentials
        if: always()
        env:
          AUTHFILE: ${{ runner.temp }}/harbor-auth-${{ github.run_id }}-${{ github.run_attempt }}.json
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$AUTHFILE" ]]; then
            podman logout \
              --authfile "$AUTHFILE" \
              "$HARBOR_REGISTRY" >/dev/null 2>&1 || true

            rm -f "$AUTHFILE"
          fi

      - name: Clean up temporary image archive
        if: always()
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.service_name }}-image.tar
        shell: bash
        run: rm -f "$IMAGE_ARCHIVE"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name }}-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/
          if-no-files-found: warn
          retention-days: 30

      - name: Display published image
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Image publiée : $SHA_TAG"

          if [[ -n "$VERSION_TAG" ]]; then
            echo "Image de release : $VERSION_TAG"
          fi
