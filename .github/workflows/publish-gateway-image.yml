name: Publish gateway image

on:
  push:
    branches:
      - main
    tags:
      - "gateway-v*"

  pull_request:
    paths:
      - "backend/gateway/**"
      - "library-parent/**"
      - "service-parent/**"
      - "backend/shared/**"
      - "bom/**"
      - "pom.xml"
      - ".github/workflows/publish-gateway-image.yml"
      - ".github/workflows/reusable-image-pipeline.yml"

  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer à publier, sans préfixe v"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-pipeline:
    name: Build, scan and publish gateway
    uses: ./.github/workflows/reusable-image-pipeline.yml

    with:
      service_name: gateway
      module_path: backend/gateway
      dockerfile_path: backend/gateway/Dockerfile
      release_tag_prefix: gateway-v
      manual_version: ${{ inputs.version || '' }}

    secrets: inherit
