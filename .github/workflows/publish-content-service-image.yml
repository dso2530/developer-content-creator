name: Publish content-service image

on:
  push:
    branches:
      - main
    tags:
      - "content-service-v*"

  pull_request:
    paths:
      - "backend/content-service/**"
      - "library-parent/**"
      - "service-parent/**"
      - "backend/shared/**"
      - "bom/**"
      - "pom.xml"
      - ".github/workflows/publish-content-service-image.yml"
      - ".github/workflows/reusable-image-pipeline.yml"

  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer à publier, sans préfixe v"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: content-service-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-pipeline:
    name: Build, scan and publish content-service
    uses: ./.github/workflows/reusable-image-pipeline.yml

    with:
      service_name: content-service
      module_path: backend/content-service
      dockerfile_path: backend/content-service/Dockerfile
      release_tag_prefix: content-service-v
      manual_version: ${{ inputs.version || '' }}

    secrets: inherit
