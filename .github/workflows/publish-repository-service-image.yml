name: Publish repository-service image

on:
  push:
    branches:
      - main
    tags:
      - "repository-service-v*"

  pull_request:
    paths:
      - "backend/repository-service/**"
      - "library-parent/**"
      - "service-parent/**"
      - "backend/shared/**"
      - "bom/**"
      - "pom.xml"
      - ".github/workflows/publish-repository-service-image.yml"
      - ".github/workflows/reusable-image-pipeline.yml"

  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer à publier, sans préfixe v"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-service-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-pipeline:
    name: Build, scan and publish repository-service
    uses: ./.github/workflows/reusable-image-pipeline.yml

    with:
      service_name: repository-service
      module_path: backend/repository-service
      dockerfile_path: backend/repository-service/Dockerfile
      release_tag_prefix: repository-service-v
      manual_version: ${{ inputs.version || '' }}

    secrets: inherit
