name: Maven CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Check Java formatting
        run: mvn -B -ntp spotless:check

      - name: Build and verify all Maven modules
        run: mvn -B -ntp clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-and-coverage-reports
          path: |
            backend/**/target/site/jacoco/
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Add test results summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Maven CI results"
            echo
            echo "- Formatting: see the **Check Java formatting** step."
            echo "- Build and tests: see the **Build and verify all Maven modules** step."
            echo
            echo "### Test reports"
            echo
            echo "Detailed Surefire, Failsafe and JaCoCo reports are available in the workflow artifacts when generated."
          } >> "$GITHUB_STEP_SUMMARY"
